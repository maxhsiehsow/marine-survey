<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 商品分析 V114 (精準控盤版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        .loader {
            border: 3px solid #e5e7eb;
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        .drag-active {
            border-color: #3b82f6 !important;
            background-color: #eff6ff !important;
            transform: scale(1.01);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .dragging { opacity: 0.5; transform: scale(0.9); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 pb-32">

    <div class="max-w-6xl mx-auto p-4 md:p-8">
        
        <header class="text-center mb-6">
            <h1 class="text-3xl font-bold text-blue-800 mb-2 flex items-center justify-center gap-2">
                <span class="material-icons text-4xl">inventory</span>
                AI 商品分析 V114
            </h1>
            <p class="text-gray-500 text-sm">手動分組 • 拖曳管理 • 精準控制</p>
        </header>

        <!-- Staging Area -->
        <div class="bg-white rounded-2xl shadow-md border border-gray-200 p-6 mb-8 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-2 h-full bg-orange-400"></div>
            
            <!-- Toolbar -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 pl-4 gap-4">
                <div>
                    <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                        <span class="material-icons text-orange-500">grid_view</span> 
                        待整理照片區
                    </h2>
                    <p class="text-xs text-gray-500">先將所有照片上傳至此，再分配到下方分組。</p>
                </div>
                
                <div class="flex gap-2 w-full md:w-auto">
                    <!-- New Button: Add Empty Group -->
                    <button onclick="addProductGroup()" class="flex-1 md:flex-none bg-blue-100 hover:bg-blue-200 text-blue-700 text-sm font-bold px-4 py-2 rounded-lg transition flex items-center justify-center gap-2 border border-blue-200">
                        <span class="material-icons text-sm">add_circle_outline</span>
                        新增空白分組
                    </button>

                    <!-- Import Button -->
                    <label class="flex-1 md:flex-none bg-orange-100 hover:bg-orange-200 text-orange-700 text-sm font-bold px-4 py-2 rounded-lg cursor-pointer transition flex items-center justify-center gap-2 border border-orange-200">
                        <span class="material-icons text-sm">upload_file</span>
                        批次匯入照片
                        <input type="file" class="hidden" accept="image/*" multiple onchange="handleStagingFiles(this)">
                    </label>
                </div>
            </div>

            <!-- Staging Grid -->
            <div id="stagingGrid" class="flex gap-3 overflow-x-auto pb-4 min-h-[120px] items-center p-2 border-2 border-dashed border-gray-200 rounded-xl bg-gray-50"
                 ondragover="handleDragOver(event)" ondrop="handleDropToStaging(event)">
                <div class="text-gray-400 text-sm mx-auto flex flex-col items-center pointer-events-none placeholder">
                    <span class="material-icons text-3xl mb-1">move_to_inbox</span>
                    <span>暫無照片，請點擊匯入</span>
                </div>
            </div>
        </div>

        <!-- Product List Container -->
        <div id="productList" class="space-y-6 mb-8 grid grid-cols-1 gap-6">
            <!-- Dynamic Product Cards will be added here -->
        </div>

        <!-- Global Analyze Button -->
        <div class="mt-8 sticky bottom-6 z-10 pointer-events-none">
            <div class="max-w-4xl mx-auto flex justify-center">
                <button id="analyzeAllBtn" onclick="analyzeAll()" class="pointer-events-auto hidden shadow-2xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-4 px-10 rounded-full transition transform hover:-translate-y-1 flex items-center justify-center gap-3">
                    <span class="material-icons">search</span>
                    <span id="analyzeBtnText">開始批量分析 (0 組)</span>
                </button>
            </div>
        </div>

    </div>

    <!-- Template: Product Group Card -->
    <template id="productTemplate">
        <div class="product-card bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden fade-in relative scroll-mt-32"
             ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDropToCard(event)">
            
            <div class="bg-gray-50 p-3 border-b border-gray-100 flex justify-between items-center pointer-events-none">
                <h3 class="font-bold text-gray-700 flex items-center gap-2 product-title text-sm">
                    <span class="material-icons text-blue-500 text-base">liquor</span> 
                    <span class="title-text">瓶罐商品</span>
                </h3>
                <button onclick="removeProduct(this)" class="pointer-events-auto text-gray-400 hover:text-red-500 p-1 rounded hover:bg-red-50 transition" title="刪除此商品">
                    <span class="material-icons text-base">close</span>
                </button>
            </div>

            <div class="p-4 flex flex-col md:flex-row gap-4 items-start">
                <div class="preview-container flex gap-2 overflow-x-auto pb-2 flex-grow min-h-[100px] w-full items-center bg-gray-50 rounded-lg p-2 border border-dashed border-gray-200">
                    <span class="text-xs text-gray-400 mx-auto pointer-events-none placeholder-text">拖曳照片至此 (最多4張)</span>
                </div>

                <div class="md:w-1/3 w-full flex flex-col justify-center border-l border-gray-100 md:pl-4 pl-0 md:border-t-0 border-t md:pt-0 pt-4">
                    <div class="status-indicator flex items-center gap-2 text-sm font-bold text-gray-400 mb-2">
                        <span class="material-icons text-base">schedule</span> 等待分析
                    </div>
                    <input type="hidden" class="hidden-result-data">
                    <button onclick="saveResult(this)" class="btn-save hidden w-full bg-green-600 hover:bg-green-700 text-white text-sm font-bold px-3 py-2 rounded-lg shadow-sm transition flex items-center justify-center gap-2">
                        <span class="material-icons text-sm">cloud_upload</span>
                        確認並上傳
                    </button>
                     <label class="mt-2 text-xs text-center text-blue-400 cursor-pointer hover:text-blue-600 flex justify-center items-center gap-1">
                        <span class="material-icons text-xs">add</span> 手動補照片
                        <input type="file" class="hidden" accept="image/*" multiple onchange="handleManualAddFiles(this)">
                    </label>
                </div>
            </div>

            <div class="report-section hidden bg-slate-50 border-t border-gray-100 p-4">
                <div class="report-content prose prose-sm max-w-none text-gray-700 bg-white p-4 rounded-lg border border-gray-200 shadow-sm"></div>
                <div class="mt-3 flex gap-2 justify-end">
                    <a href="#" target="_blank" class="btn-search-product hidden text-xs bg-white border border-gray-200 text-gray-600 px-3 py-1 rounded-full hover:bg-gray-50 transition flex items-center gap-1">
                        <span class="material-icons text-[14px]">search</span> 搜商品
                    </a>
                </div>
            </div>
        </div>
    </template>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycby9o_X9XjKpNxIx2xBeykcRk_gdMU144a-q6Ga2vZK5j4I2qxh0pBGlkWI6E5Ol-Q-OsQ/exec";

        let productCounter = 0;
        let stagingCounter = 0;

        window.addEventListener('load', () => {});

        // --- 1. 待整理區邏輯 ---
        async function handleStagingFiles(input) {
            const files = Array.from(input.files);
            if (files.length === 0) return;
            const grid = document.getElementById('stagingGrid');
            if (grid.querySelector('.placeholder')) grid.innerHTML = ''; 
            for (const file of files) await addToStaging(file);
            input.value = '';
        }

        async function addToStaging(file) {
            stagingCounter++;
            const base64 = await getBase64(file);
            const grid = document.getElementById('stagingGrid');
            const div = document.createElement('div');
            div.id = `stage-img-${stagingCounter}`;
            div.className = 'w-24 h-24 rounded-lg overflow-hidden border border-gray-200 relative flex-shrink-0 group bg-white shadow-sm cursor-grab active:cursor-grabbing hover:scale-105 transition';
            div.draggable = true;
            div.ondragstart = handleDragStart;
            div.innerHTML = `
                <img src="${base64}" class="w-full h-full object-cover pointer-events-none">
                <button onclick="this.parentElement.remove()" class="absolute top-1 right-1 bg-red-500 text-white rounded-full p-0.5 opacity-0 group-hover:opacity-100 transition shadow-sm z-10">
                    <span class="material-icons text-xs block">close</span>
                </button>
                <input type="hidden" class="img-data" value="${base64}">
                <input type="hidden" class="img-type" value="${file.type}">
                <input type="hidden" class="img-name" value="${file.name}">
            `;
            grid.appendChild(div);
        }

        // --- 2. 拖曳核心邏輯 ---

        let draggedEl = null;

        function handleDragStart(e) {
            draggedEl = e.target;
            e.target.classList.add('dragging');
            e.dataTransfer.setData('text/plain', e.target.id);
            e.dataTransfer.effectAllowed = 'move';
        }
        function handleDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-active'); }
        function handleDragLeave(e) {
            e.preventDefault();
            if (!e.currentTarget.contains(e.relatedTarget)) e.currentTarget.classList.remove('drag-active');
        }

        async function handleDropToStaging(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-active');
            const grid = document.getElementById('stagingGrid');
            
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
                if (grid.querySelector('.placeholder')) grid.innerHTML = '';
                for (const file of files) await addToStaging(file);
            }
            if (draggedEl) { draggedEl.classList.remove('dragging'); draggedEl = null; }
        }

        async function handleDropToCard(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-active');
            const card = e.currentTarget;
            const container = card.querySelector('.preview-container');

            if (container.querySelectorAll('.img-item').length >= 4) {
                alert("此瓶罐已滿 4 張照片！");
                if (draggedEl) { draggedEl.classList.remove('dragging'); draggedEl = null; }
                return;
            }
            if (container.querySelector('.placeholder-text')) container.innerHTML = '';

            const id = e.dataTransfer.getData('text/plain');
            if (id && document.getElementById(id)) {
                const sourceEl = document.getElementById(id);
                await addImageToCard(card, {
                    base64: sourceEl.querySelector('.img-data').value,
                    type: sourceEl.querySelector('.img-type').value,
                    name: sourceEl.querySelector('.img-name').value
                });
                sourceEl.remove();
            } else if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
                for (const file of files) {
                    if (container.querySelectorAll('.img-item').length >= 4) break;
                    const base64 = await getBase64(file);
                    await addImageToCard(card, { base64, type: file.type, name: file.name });
                }
            }
            if (draggedEl) { draggedEl.classList.remove('dragging'); draggedEl = null; }
            updateGlobalButton();
        }

        // --- 卡片操作 ---
        function addProductGroup() {
            productCounter++;
            const template = document.getElementById('productTemplate');
            const clone = template.content.cloneNode(true);
            const card = clone.querySelector('.product-card');
            card.id = `product-${productCounter}`;
            card.querySelector('.title-text').textContent = `瓶罐商品 #${productCounter}`;
            document.getElementById('productList').prepend(card); // 倒序排列：最新的在最上面
            
            // 讓使用者知道新分組在哪
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            updateGlobalButton();
            return card;
        }

        function removeProduct(btn) {
            if (confirm("移除此商品分組？")) {
                btn.closest('.product-card').remove();
                updateGlobalButton();
            }
        }

        async function handleManualAddFiles(input) {
            const files = Array.from(input.files);
            const card = input.closest('.product-card');
            const container = card.querySelector('.preview-container');
            if (container.querySelector('.placeholder-text')) container.innerHTML = '';
            for (const file of files) {
                if (container.querySelectorAll('.img-item').length >= 4) { alert("已滿 4 張"); break; }
                const base64 = await getBase64(file);
                await addImageToCard(card, { base64, type: file.type, name: file.name });
            }
            input.value = '';
            updateGlobalButton();
        }

        async function addImageToCard(card, imgObj) {
            const container = card.querySelector('.preview-container');
            const div = document.createElement('div');
            div.className = 'img-item w-20 h-20 rounded-lg overflow-hidden border border-gray-200 relative flex-shrink-0 group bg-gray-100';
            div.innerHTML = `
                <img src="${imgObj.base64}" class="w-full h-full object-cover">
                <button onclick="removeImageFromCard(this)" class="absolute top-1 right-1 bg-red-500 text-white rounded-full p-0.5 opacity-0 group-hover:opacity-100 transition shadow-sm z-10">
                    <span class="material-icons text-xs block">close</span>
                </button>
                <input type="hidden" class="img-data" value="${imgObj.base64}">
                <input type="hidden" class="img-type" value="${imgObj.type}">
                <input type="hidden" class="img-name" value="${imgObj.name}">
            `;
            container.appendChild(div);
        }

        function removeImageFromCard(btn) {
            const container = btn.closest('.preview-container');
            btn.parentElement.remove();
            if (container.children.length === 0) {
                container.innerHTML = `<span class="text-xs text-gray-400 mx-auto pointer-events-none placeholder-text">拖曳照片至此 (最多4張)</span>`;
            }
            updateGlobalButton();
        }

        function updateGlobalButton() {
            const count = document.querySelectorAll('.product-card').length;
            const hasImages = document.querySelectorAll('#productList .img-data').length > 0;
            const btn = document.getElementById('analyzeAllBtn');
            const btnText = document.getElementById('analyzeBtnText');
            if (count > 0 && hasImages) {
                btn.classList.remove('hidden');
                btnText.textContent = `開始批量分析 (${count} 組)`;
            } else {
                btn.classList.add('hidden');
            }
        }

        // --- 3. 批量分析邏輯 (V113 熔斷保護核心) ---

        async function analyzeAll() {
            const cards = Array.from(document.querySelectorAll('.product-card'));
            const btn = document.getElementById('analyzeAllBtn');
            const originalBtnText = btn.innerHTML;
            
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            
            let abortBatch = false; // 熔斷旗標

            for (let i = 0; i < cards.length; i++) {
                if (abortBatch) break; // 若已熔斷，停止後續處理

                const card = cards[i];
                if (card.dataset.status === 'done' || card.dataset.status === 'saved') continue;
                const imgElements = card.querySelectorAll('.img-data');
                if (imgElements.length === 0) continue;

                const imagesPayload = [];
                imgElements.forEach(el => {
                    const base64 = el.value.split(',')[1];
                    const type = el.parentElement.querySelector('.img-type').value;
                    const name = el.parentElement.querySelector('.img-name').value;
                    imagesPayload.push({ mimeType: type, data: base64, filename: name });
                });

                // --- 智慧重試迴圈 ---
                let attempts = 0;
                let success = false;
                const maxAttempts = 2; // 減少重試次數，避免過度等待

                while (!success && attempts < maxAttempts) {
                    try {
                        const status = card.querySelector('.status-indicator');
                        status.innerHTML = `<span class="loader w-4 h-4 border-t-blue-600 border-blue-200"></span> 分析中...` + (attempts > 0 ? ` (重試 ${attempts})` : "");
                        status.className = "status-indicator flex items-center gap-2 text-sm font-bold text-blue-600 mb-2";
                        
                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });

                        const response = await fetch(GAS_WEB_APP_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ mode: "analyze", images: imagesPayload })
                        });
                        
                        const resJson = await response.json();

                        if (resJson.status === 'success') {
                            // 成功
                            const reportSection = card.querySelector('.report-section');
                            const reportContent = card.querySelector('.report-content');
                            reportSection.classList.remove('hidden');
                            reportContent.innerHTML = marked.parse(resJson.data.fullReport);
                            status.innerHTML = `<span class="material-icons text-green-500">check_circle</span> 待確認`;
                            status.className = "status-indicator flex items-center gap-2 text-sm font-bold text-green-600 mb-2";
                            card.dataset.status = 'done';
                            card.querySelector('.btn-save').classList.remove('hidden');
                            card.querySelector('.hidden-result-data').value = JSON.stringify(resJson.data);
                            
                            if (resJson.data.productName && resJson.data.productName !== "未知") {
                                const searchBtn = card.querySelector('.btn-search-product');
                                searchBtn.href = `https://www.google.com/search?q=${encodeURIComponent(resJson.data.productName)}`;
                                searchBtn.classList.remove('hidden');
                            }
                            success = true; 

                        } else {
                            throw new Error(resJson.message);
                        }

                    } catch (err) {
                        const errMsg = err.message || "";
                        // 檢查配額錯誤
                        if (errMsg.includes("Quota exceeded") || errMsg.includes("429") || errMsg.includes("rate limit")) {
                            attempts++;
                            const status = card.querySelector('.status-indicator');
                            
                            // 若已經是最後一次嘗試，則觸發熔斷
                            if (attempts >= maxAttempts) {
                                console.error("Quota Exceeded persistently. Aborting batch.");
                                status.innerHTML = `<span class="material-icons text-red-500">error</span> 配額耗盡 (停止)`;
                                status.className = "status-indicator flex items-center gap-2 text-sm font-bold text-red-600 mb-2";
                                alert("⚠️ 系統偵測到 Google API 配額已耗盡，且重試無效。\n為避免無效等待，已自動停止後續分析。\n請稍候 2~5 分鐘後再試。");
                                abortBatch = true;
                                break;
                            }

                            // 否則，啟動冷卻倒數
                            status.className = "status-indicator flex items-center gap-2 text-sm font-bold text-orange-500 mb-2";
                            for (let s = 60; s > 0; s--) {
                                status.innerHTML = `<span class="loader !border-t-orange-500"></span> 塞車冷卻中 ${s}s...`;
                                btn.innerHTML = `<span class="loader !w-4 !h-4 !border-t-white mr-2"></span> 強制冷卻 (${s}s)...`;
                                await new Promise(r => setTimeout(r, 1000));
                            }
                        } else {
                            // 非配額錯誤 (如 500, 400)，直接失敗，但不熔斷
                            console.error(err);
                            const status = card.querySelector('.status-indicator');
                            status.innerHTML = `<span class="material-icons text-red-500">error</span> 失敗`;
                            status.className = "status-indicator flex items-center gap-2 text-sm font-bold text-red-600 mb-2";
                            const reportSection = card.querySelector('.report-section');
                            const reportContent = card.querySelector('.report-content');
                            reportSection.classList.remove('hidden');
                            reportContent.innerHTML = `<span class="text-red-500">分析失敗：${errMsg}</span>`;
                            break; 
                        }
                    }
                } // End While

                // 正常緩衝 (如果成功且還有下一張)
                if (success && !abortBatch && i < cards.length - 1) {
                    btn.innerHTML = `<span class="loader !w-4 !h-4 !border-t-white mr-2"></span> 緩衝休息中 (剩 ${cards.length - 1 - i} 組)...`;
                    await new Promise(r => setTimeout(r, 12000)); 
                }
            }

            btn.disabled = false;
            btn.classList.remove('opacity-75', 'cursor-not-allowed');
            btn.innerHTML = abortBatch ? `<span class="material-icons">warning</span> 分析已中斷` : originalBtnText;
            document.getElementById('analyzeBtnText').textContent = abortBatch ? "請稍後再試" : "批量分析完成";
        }

        async function saveResult(btn) {
            const card = btn.closest('.product-card');
            const dataStr = card.querySelector('.hidden-result-data').value;
            if (!dataStr) return;
            const data = JSON.parse(dataStr);
            const originalContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<span class="loader !w-3 !h-3 !border-t-white mr-1"></span>`;
            btn.classList.add('opacity-75');

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ mode: "save", data: data })
                });
                const resJson = await response.json();
                if (resJson.status === 'success') {
                    btn.innerHTML = `<span class="material-icons text-sm">cloud_done</span> 已存檔`;
                    btn.className = "btn-save w-full bg-gray-100 text-gray-400 text-sm font-bold px-3 py-2 rounded-lg cursor-default flex items-center justify-center gap-2 border border-gray-200";
                    card.dataset.status = 'saved';
                    const status = card.querySelector('.status-indicator');
                    status.innerHTML = `<span class="material-icons text-green-600">cloud_done</span> 已上傳至 Sheet`;
                } else { throw new Error("存檔失敗"); }
            } catch (err) {
                alert("上傳失敗：" + err.message);
                btn.disabled = false;
                btn.innerHTML = originalContent;
                btn.classList.remove('opacity-75');
            }
        }

        function getBase64(file) {
            return new Promise((r, j) => {
                const reader = new FileReader();
                reader.onload = () => r(reader.result);
                reader.onerror = j;
                reader.readAsDataURL(file);
            });
        }
    </script>
</body>
</html>
