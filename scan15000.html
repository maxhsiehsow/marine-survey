<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 商品分析 V107 (多圖深度搜查版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        .loader {
            border: 3px solid #e5e7eb;
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.5s ease-in; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 pb-20">

    <div class="max-w-3xl mx-auto p-4 md:p-8">
        
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-800 mb-2 flex items-center justify-center gap-2">
                <span class="material-icons text-4xl">travel_explore</span>
                AI 商品分析 V107
            </h1>
            <p class="text-gray-500 text-sm">多圖識別 • 深度肉搜 • 存檔控制</p>
        </header>

        <!-- Config Area -->
        <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-200 mb-6">
            <h2 class="text-sm font-bold text-gray-700 mb-3 flex items-center gap-2">
                <span class="material-icons text-blue-600 text-sm">settings</span> 設定
            </h2>
            
            <label class="flex items-center gap-3 p-3 bg-blue-50 rounded-lg cursor-pointer border border-blue-100 hover:bg-blue-100 transition">
                <input type="checkbox" id="saveToSheetCheck" class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500" checked>
                <div>
                    <span class="block text-sm font-bold text-gray-800">將結果存入 Google Sheet</span>
                    <span class="block text-xs text-gray-500">勾選後，分析結果將自動寫入後端試算表</span>
                </div>
            </label>
        </div>

        <!-- Upload Area -->
        <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-200 mb-8">
            <label class="block text-sm font-bold text-gray-700 mb-2">上傳商品照片 (單一商品，至多4張)</label>
            <p class="text-xs text-gray-400 mb-4">建議拍攝：正面全貌、背面資訊、側面條碼、頂部特寫，讓 AI 判斷更準確。</p>
            
            <div class="flex items-center justify-center w-full mb-4">
                <label for="fileInput" class="flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-blue-300 rounded-xl cursor-pointer bg-slate-50 hover:bg-slate-100 transition relative group">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                        <span class="material-icons text-blue-400 text-4xl mb-1 group-hover:scale-110 transition">add_photo_alternate</span>
                        <p class="text-sm text-blue-600 font-medium">點擊選擇 1~4 張照片</p>
                    </div>
                    <!-- 限制 multiple 選擇 -->
                    <input id="fileInput" type="file" class="hidden" accept="image/*" multiple />
                </label>
            </div>

            <!-- Previews -->
            <div id="previewGrid" class="grid grid-cols-4 gap-2 hidden">
                <!-- Javascript will populate this -->
            </div>
        </div>

        <!-- Start Button -->
        <button id="analyzeBtn" class="hidden w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2 mb-8">
            <span class="material-icons">search</span>
            <span>開始深度分析</span>
        </button>

        <!-- Result Card -->
        <div id="resultCard" class="hidden bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden fade-in">
            <div class="bg-blue-600 p-4 text-white flex justify-between items-center">
                <h3 class="font-bold flex items-center gap-2">
                    <span class="material-icons">analytics</span> 分析報告
                </h3>
                <span id="statusBadge" class="bg-blue-500 text-xs px-2 py-1 rounded">分析中...</span>
            </div>
            
            <div class="p-6">
                <!-- Report Content -->
                <div id="reportContent" class="prose prose-sm max-w-none text-gray-700">
                    <div class="flex justify-center py-8">
                        <div class="loader"></div>
                    </div>
                </div>

                <!-- Footer Actions -->
                <div id="actionButtons" class="mt-6 pt-4 border-t border-gray-100 flex flex-wrap gap-2 hidden">
                    <a href="#" target="_blank" id="btnGoogleProduct" class="bg-gray-100 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-200 transition text-sm flex items-center gap-1 font-bold">
                        <span class="material-icons text-sm">search</span> 搜商品
                    </a>
                    <a href="#" target="_blank" id="btnGoogleBarcode" class="bg-blue-50 text-blue-700 px-4 py-2 rounded-lg hover:bg-blue-100 transition text-sm flex items-center gap-1 font-bold">
                        <span class="material-icons text-sm">qr_code</span> 搜條碼
                    </a>
                </div>
                
                <div id="saveStatus" class="mt-2 text-xs text-right text-gray-400 h-4"></div>
            </div>
        </div>

    </div>

    <script>
        // 【請確認這裡填入的是正確的 GAS 部署網址】
        // 範例格式：https://script.google.com/macros/s/AKfycbx.../exec
        const GAS_WEB_APP_URL = "在此填入你的GAS_WEB_APP_URL";

        let selectedFiles = [];

        const els = {
            fileInput: document.getElementById('fileInput'),
            previewGrid: document.getElementById('previewGrid'),
            analyzeBtn: document.getElementById('analyzeBtn'),
            resultCard: document.getElementById('resultCard'),
            statusBadge: document.getElementById('statusBadge'),
            reportContent: document.getElementById('reportContent'),
            actionButtons: document.getElementById('actionButtons'),
            btnGoogleProduct: document.getElementById('btnGoogleProduct'),
            btnGoogleBarcode: document.getElementById('btnGoogleBarcode'),
            saveCheck: document.getElementById('saveToSheetCheck'),
            saveStatus: document.getElementById('saveStatus')
        };

        // 1. 檔案選擇
        els.fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            // 限制最多 4 張
            if (files.length > 4) {
                alert("一次最多只能上傳 4 張照片！將自動選取前 4 張。");
                selectedFiles = files.slice(0, 4);
            } else {
                selectedFiles = files;
            }

            // 顯示預覽
            els.previewGrid.innerHTML = '';
            els.previewGrid.classList.remove('hidden');
            
            for (const file of selectedFiles) {
                const base64 = await getBase64(file);
                const div = document.createElement('div');
                div.className = 'aspect-square rounded-lg overflow-hidden border border-gray-200 relative';
                div.innerHTML = `<img src="${base64}" class="w-full h-full object-cover">`;
                els.previewGrid.appendChild(div);
            }

            els.analyzeBtn.classList.remove('hidden');
            els.analyzeBtn.innerHTML = `<span class="material-icons">search</span> <span>開始深度分析 (${selectedFiles.length} 張)</span>`;
            
            // 重置結果區
            els.resultCard.classList.add('hidden');
        });

        // 2. 開始分析
        els.analyzeBtn.addEventListener('click', async () => {
            if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes("在此填入")) {
                alert("請確認程式碼中的 GAS 網址是否正確");
                return;
            }

            // UI 狀態更新
            els.analyzeBtn.disabled = true;
            els.analyzeBtn.classList.add('opacity-50');
            els.analyzeBtn.innerHTML = `<span class="loader !w-4 !h-4 !border-t-white mr-2"></span> AI 思考中...`;
            
            els.resultCard.classList.remove('hidden');
            els.reportContent.innerHTML = `<div class="flex flex-col items-center py-8 text-gray-500"><div class="loader mb-2"></div><p>正在連線知識庫進行肉搜...</p></div>`;
            els.statusBadge.textContent = "處理中";
            els.statusBadge.className = "bg-blue-500 text-xs px-2 py-1 rounded text-white";
            els.actionButtons.classList.add('hidden');
            els.saveStatus.textContent = "";

            try {
                // 準備 Payload (多圖)
                const imagePayloads = [];
                for (const file of selectedFiles) {
                    const b64 = await getBase64(file);
                    imagePayloads.push({
                        mimeType: file.type,
                        data: b64.split(',')[1], // 去除 header
                        filename: file.name
                    });
                }

                const payload = {
                    images: imagePayloads,
                    saveToSheet: els.saveCheck.checked // 傳送存檔意願
                };

                // 發送請求
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                const resJson = await response.json();

                if (resJson.status === 'success') {
                    // 顯示報告
                    els.reportContent.innerHTML = marked.parse(resJson.data.fullReport);
                    els.statusBadge.textContent = "完成";
                    els.statusBadge.className = "bg-green-500 text-xs px-2 py-1 rounded text-white";

                    // 處理存檔狀態
                    if (resJson.data.saved) {
                        els.saveStatus.textContent = "✅ 資料已成功存入 Google Sheet";
                    } else {
                        els.saveStatus.textContent = "ℹ️ 本次結果未存檔 (使用者未勾選)";
                    }

                    // 設定搜尋按鈕
                    const nameMatch = resJson.data.fullReport.match(/\*\*商品名稱\*\*:\s*(.*?)(\n|$)/);
                    if (nameMatch && nameMatch[1]) {
                        const productName = nameMatch[1].trim();
                        els.actionButtons.classList.remove('hidden');
                        
                        els.btnGoogleProduct.href = `https://www.google.com/search?q=${encodeURIComponent(productName)}`;
                        // 條碼搜尋技巧：搜尋 "商品名 + 條碼" 並切換到圖片模式
                        els.btnGoogleBarcode.href = `https://www.google.com/search?q=${encodeURIComponent(productName + " EAN barcode")}&tbm=isch`;
                    }

                } else {
                    throw new Error(resJson.message || "未知錯誤");
                }

            } catch (error) {
                console.error(error);
                els.reportContent.innerHTML = `<div class="bg-red-50 p-4 rounded text-red-600"><strong>錯誤：</strong> ${error.message}</div>`;
                els.statusBadge.textContent = "失敗";
                els.statusBadge.className = "bg-red-500 text-xs px-2 py-1 rounded text-white";
            } finally {
                els.analyzeBtn.disabled = false;
                els.analyzeBtn.classList.remove('opacity-50');
                els.analyzeBtn.innerHTML = `<span class="material-icons">search</span> <span>開始深度分析</span>`;
            }
        });

        function getBase64(file) {
            return new Promise((r, j) => {
                const reader = new FileReader();
                reader.onload = () => r(reader.result);
                reader.onerror = j;
                reader.readAsDataURL(file);
            });
        }
    </script>
</body>
</html>
