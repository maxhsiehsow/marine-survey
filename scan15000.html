<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 商品分析 V105 (Server-Side 旗艦版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        .loader {
            border: 3px solid #e5e7eb;
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.5s ease-in; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800 pb-20">

    <div class="max-w-4xl mx-auto p-4 md:p-8">
        
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-800 mb-2 flex items-center justify-center gap-2">
                <span class="material-icons text-4xl">cloud_sync</span>
                AI 商品分析 V105
            </h1>
            <p class="text-gray-500 text-sm">Server-Side 架構 • 金鑰隱藏 • 自動存檔</p>
        </header>

        <!-- Config Status -->
        <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-200 mb-6">
            <div class="flex items-center gap-3">
                <div class="bg-green-100 p-2 rounded-full">
                    <span class="material-icons text-green-600">secure_connect</span>
                </div>
                <div>
                    <h3 class="font-bold text-gray-700">後端連線模式</h3>
                    <p class="text-xs text-gray-500">API Key 已由後端 GAS 託管，前端僅負責顯示。</p>
                </div>
            </div>
        </div>

        <!-- Upload Area -->
        <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-200 mb-8">
            <label class="block text-sm font-bold text-gray-700 mb-2">上傳商品圖片 (批次)</label>
            <div class="flex items-center justify-center w-full">
                <label for="fileInput" class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-blue-300 rounded-xl cursor-pointer bg-blue-50 hover:bg-blue-100 transition relative group">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                        <span class="material-icons text-blue-500 text-4xl mb-1 group-hover:scale-110 transition">add_a_photo</span>
                        <p class="text-sm text-blue-700 font-medium">點擊選擇圖片</p>
                    </div>
                    <input id="fileInput" type="file" class="hidden" accept="image/*" multiple />
                </label>
            </div>
        </div>

        <!-- Start Button -->
        <button id="startBatchBtn" class="hidden w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-4 px-6 rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2 mb-8 transform hover:-translate-y-1">
            <span class="material-icons">rocket_launch</span>
            <span>開始雲端分析 (<span id="fileCount">0</span> 張)</span>
        </button>

        <!-- Results -->
        <div id="resultsGrid" class="grid grid-cols-1 gap-6"></div>

    </div>

    <!-- Template -->
    <template id="resultCardTemplate">
        <div class="result-card bg-white rounded-xl shadow-sm overflow-hidden border border-gray-200 fade-in flex flex-col md:flex-row">
            <div class="w-full md:w-1/3 bg-gray-100 relative group min-h-[200px]">
                <img src="" class="card-img w-full h-full object-cover absolute inset-0" alt="Product">
                <div class="absolute inset-0 bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition duration-300">
                    <span class="text-white text-xs px-2 py-1 border border-white rounded">圖片預覽</span>
                </div>
            </div>
            <div class="w-full md:w-2/3 p-6 flex flex-col">
                <div class="flex justify-between items-start mb-2">
                    <h3 class="card-filename text-sm text-gray-500 font-mono truncate max-w-[200px]">filename.jpg</h3>
                    <div class="card-status flex items-center gap-1 text-xs font-bold px-2 py-1 rounded-full bg-gray-100 text-gray-500">
                        <span class="material-icons text-sm">schedule</span> 等待中
                    </div>
                </div>
                
                <div class="card-content flex-grow prose prose-sm max-w-none text-gray-600 mb-2">
                    <p class="text-gray-400 italic text-sm">準備傳送至後端...</p>
                </div>
                
                <div class="card-actions mt-2 pt-2 border-t border-gray-100 flex flex-wrap gap-2 text-xs">
                    <a href="#" target="_blank" class="btn-search-product hidden bg-blue-100 text-blue-800 px-3 py-1 rounded-full hover:bg-blue-200 transition flex items-center gap-1">
                        <span class="material-icons text-xs">search</span> Google 搜尋
                    </a>
                </div>
            </div>
        </div>
    </template>

    <script>
        // --- 設定區 ---
        
        // 【已填入您的 Google Apps Script 網址】
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycby9o_X9XjKpNxIx2xBeykcRk_gdMU144a-q6Ga2vZK5j4I2qxh0pBGlkWI6E5Ol-Q-OsQ/exec"; 

        let selectedFiles = [];
        let isBatchStopped = false;

        const els = {
            fileInput: document.getElementById('fileInput'),
            startBtn: document.getElementById('startBatchBtn'),
            fileCount: document.getElementById('fileCount'),
            resultsGrid: document.getElementById('resultsGrid'),
            template: document.getElementById('resultCardTemplate')
        };

        // --- 1. 檔案選擇處理 ---
        els.fileInput.addEventListener('change', (e) => {
            const newFiles = Array.from(e.target.files);
            if (newFiles.length === 0) return;
            selectedFiles = [...selectedFiles, ...newFiles];
            els.fileCount.textContent = selectedFiles.length;
            els.startBtn.classList.remove('hidden'); // 只要有檔案就顯示按鈕，不再檢查 API Key
            newFiles.forEach((file, index) => {
                createResultCard(file, selectedFiles.length - newFiles.length + index);
            });
            els.fileInput.value = ''; 
        });

        function createResultCard(file, index) {
            const clone = els.template.content.cloneNode(true);
            const card = clone.querySelector('.result-card');
            card.id = `card-${index}`;
            const img = clone.querySelector('.card-img');
            const reader = new FileReader();
            reader.onload = (e) => img.src = e.target.result;
            reader.readAsDataURL(file);
            clone.querySelector('.card-filename').textContent = file.name;
            els.resultsGrid.appendChild(clone);
        }

        // --- 2. 批次流程 ---
        els.startBtn.addEventListener('click', async () => {
            if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes("在此填入")) {
                alert("請先在程式碼中填入 Google Apps Script 網址！");
                return;
            }

            els.startBtn.disabled = true;
            els.startBtn.classList.add('opacity-50', 'cursor-not-allowed');
            els.startBtn.innerHTML = `<span class="loader !w-4 !h-4 !border-t-white mr-2"></span> 處理中...`;
            isBatchStopped = false;

            for (let i = 0; i < selectedFiles.length; i++) {
                if (isBatchStopped) break;
                const cardId = `card-${i}`;
                const cardEl = document.getElementById(cardId);
                if (cardEl.dataset.status === 'done') continue;

                await processImage(selectedFiles[i], cardId);
            }

            els.startBtn.textContent = '所有任務完成';
            els.startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            els.startBtn.disabled = false;
        });

        // --- 3. 核心處理 (呼叫 GAS) ---
        async function processImage(file, cardId) {
            const card = document.getElementById(cardId);
            const statusBadge = card.querySelector('.card-status');
            const contentArea = card.querySelector('.card-content');
            const btnProduct = card.querySelector('.btn-search-product');

            updateStatus(statusBadge, 'loading', '後端分析中...');
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });

            try {
                const base64Data = await getBase64(file);
                // 移除 data:image/jpeg;base64, 前綴，GAS 只需內容
                const cleanBase64 = base64Data.split(',')[1];
                
                // 準備 Payload
                const payload = {
                    image: cleanBase64,
                    mimeType: file.type,
                    filename: file.name
                };

                // 發送請求 (使用 text/plain 避免 CORS Preflight 405/403 錯誤)
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
                    body: JSON.stringify(payload)
                });

                const jsonResponse = await response.json();

                if (jsonResponse.status === 'success') {
                    updateStatus(statusBadge, 'success', '分析完成');
                    contentArea.innerHTML = marked.parse(jsonResponse.data.fullReport);
                    card.dataset.status = 'done';

                    if (jsonResponse.data.productName && jsonResponse.data.productName !== "未知") {
                        btnProduct.href = `https://www.google.com/search?q=${encodeURIComponent(jsonResponse.data.productName)}`;
                        btnProduct.classList.remove('hidden');
                    }
                } else {
                    throw new Error(jsonResponse.message || "後端回傳錯誤");
                }

            } catch (error) {
                console.error(error);
                updateStatus(statusBadge, 'error', '失敗');
                contentArea.innerHTML = `
                    <div class="text-red-600 bg-red-50 p-3 rounded text-sm">
                        <strong>錯誤：</strong> ${error.message}<br>
                        <span class="text-xs text-gray-500">請檢查 GAS 後端授權是否完成。</span>
                    </div>`;
            }
        }

        function updateStatus(el, type, text) {
            el.className = `card-status flex items-center gap-1 text-xs font-bold px-3 py-1 rounded-full transition-colors`;
            if (type === 'loading') {
                el.classList.add('bg-blue-100', 'text-blue-700');
                el.innerHTML = `<div class="loader !w-3 !h-3 !border-t-blue-700 mr-1"></div> ${text}`;
            } else if (type === 'success') {
                el.classList.add('bg-green-100', 'text-green-700');
                el.innerHTML = `<span class="material-icons !text-sm">check_circle</span> ${text}`;
            } else if (type === 'error') {
                el.classList.add('bg-red-100', 'text-red-700');
                el.innerHTML = `<span class="material-icons !text-sm">error</span> ${text}`;
            }
        }

        function getBase64(file) {
            return new Promise((r, j) => {
                const reader = new FileReader();
                reader.onload = () => r(reader.result);
                reader.onerror = j;
                reader.readAsDataURL(file);
            });
        }
    </script>
</body>
</html>
