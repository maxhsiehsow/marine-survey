<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 商品分析 V108 (分組確認版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        .loader {
            border: 3px solid #e5e7eb;
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.5s ease-in; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 pb-20">

    <div class="max-w-4xl mx-auto p-4 md:p-8">
        
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-800 mb-2 flex items-center justify-center gap-2">
                <span class="material-icons text-4xl">inventory</span>
                AI 商品分析 V108
            </h1>
            <p class="text-gray-500 text-sm">分組管理 • 人工確認 • 精準存檔</p>
        </header>

        <!-- Product List Container -->
        <div id="productList" class="space-y-6">
            <!-- Dynamic Product Cards will be added here -->
        </div>

        <!-- Add Button -->
        <div class="mt-6 text-center">
            <button onclick="addProductGroup()" class="bg-white border-2 border-dashed border-blue-300 text-blue-600 font-bold py-3 px-6 rounded-xl hover:bg-blue-50 transition flex items-center justify-center gap-2 mx-auto w-full md:w-1/2">
                <span class="material-icons">add_circle_outline</span>
                新增下一個瓶罐 (商品)
            </button>
        </div>

        <!-- Global Analyze Button -->
        <div class="mt-8 sticky bottom-6 z-10">
            <button id="analyzeAllBtn" onclick="analyzeAll()" class="hidden w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-xl shadow-xl transition duration-200 flex items-center justify-center gap-2">
                <span class="material-icons">search</span>
                <span>開始批量分析</span>
            </button>
        </div>

    </div>

    <!-- Template: Product Group Card -->
    <template id="productTemplate">
        <div class="product-card bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden fade-in relative">
            
            <!-- Header -->
            <div class="bg-gray-50 p-4 border-b border-gray-100 flex justify-between items-center">
                <h3 class="font-bold text-gray-700 flex items-center gap-2 product-title">
                    <span class="material-icons text-blue-500">liquor</span> 瓶罐 #1
                </h3>
                <button onclick="removeProduct(this)" class="text-red-400 hover:text-red-600 p-1 rounded hover:bg-red-50 transition" title="刪除此商品">
                    <span class="material-icons">delete_outline</span>
                </button>
            </div>

            <!-- Upload Section -->
            <div class="p-6 upload-section">
                <label class="block text-sm font-bold text-gray-700 mb-2">上傳照片 (最多4張)</label>
                <div class="flex flex-wrap gap-4 items-start">
                    <!-- File Input Trigger -->
                    <label class="flex flex-col items-center justify-center w-32 h-32 border-2 border-dashed border-blue-200 rounded-lg cursor-pointer bg-blue-50 hover:bg-blue-100 transition relative">
                        <span class="material-icons text-blue-300 text-3xl">add_a_photo</span>
                        <span class="text-xs text-blue-500 mt-1">選擇照片</span>
                        <input type="file" class="hidden file-input" accept="image/*" multiple onchange="handleFileSelect(this)">
                    </label>
                    
                    <!-- Preview Container -->
                    <div class="preview-container flex gap-2 overflow-x-auto pb-2"></div>
                </div>
            </div>

            <!-- Analysis Result Section (Hidden initially) -->
            <div class="result-section hidden border-t border-gray-100">
                <div class="p-6 bg-slate-50">
                    <div class="status-indicator mb-4 flex items-center gap-2 text-sm font-bold text-gray-500">
                        <span class="loader w-4 h-4 border-t-gray-500"></span> 等待分析...
                    </div>
                    
                    <div class="report-content prose prose-sm max-w-none text-gray-700 bg-white p-4 rounded-lg border border-gray-200 shadow-sm min-h-[100px]">
                        <!-- Markdown Report -->
                    </div>

                    <!-- Action Bar -->
                    <div class="mt-4 pt-4 border-t border-gray-200 flex flex-wrap justify-between items-center gap-2">
                        <div class="flex gap-2">
                            <a href="#" target="_blank" class="btn-search-product hidden text-xs bg-gray-200 text-gray-700 px-3 py-1 rounded-full hover:bg-gray-300 transition flex items-center gap-1">
                                <span class="material-icons text-[14px]">search</span> 搜商品
                            </a>
                        </div>
                        
                        <!-- Manual Save Button -->
                        <button onclick="saveResult(this)" class="btn-save hidden bg-green-600 hover:bg-green-700 text-white text-sm font-bold px-4 py-2 rounded-lg shadow-sm transition flex items-center gap-2">
                            <span class="material-icons text-sm">cloud_upload</span>
                            確認無誤並上傳至 Sheet
                        </button>
                    </div>
                </div>
            </div>

            <!-- Hidden Data Storage for Saving -->
            <input type="hidden" class="hidden-result-data">
        </div>
    </template>

    <script>
        // 1. 已內建您指定的 URL
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycby9o_X9XjKpNxIx2xBeykcRk_gdMU144a-q6Ga2vZK5j4I2qxh0pBGlkWI6E5Ol-Q-OsQ/exec";

        let productCount = 0;

        // 初始化：預設加入一個商品
        window.addEventListener('load', () => {
            addProductGroup();
        });

        // --- UI 操作邏輯 ---

        function addProductGroup() {
            productCount++;
            const template = document.getElementById('productTemplate');
            const clone = template.content.cloneNode(true);
            
            const card = clone.querySelector('.product-card');
            card.dataset.id = productCount;
            card.querySelector('.product-title').innerHTML = `<span class="material-icons text-blue-500">liquor</span> 瓶罐 (商品) #${productCount}`;
            
            document.getElementById('productList').appendChild(card);
            updateGlobalButton();
        }

        function removeProduct(btn) {
            if (document.querySelectorAll('.product-card').length <= 1) {
                alert("至少需要保留一個商品分組！");
                return;
            }
            if (confirm("確定要刪除這個分組嗎？")) {
                btn.closest('.product-card').remove();
                // 重新編號標題 (可選，這裡略過以保持簡單)
                updateGlobalButton();
            }
        }

        async function handleFileSelect(input) {
            const files = Array.from(input.files);
            if (files.length === 0) return;

            const card = input.closest('.product-card');
            const previewContainer = card.querySelector('.preview-container');
            
            // 檢查目前已有的數量
            const currentImgs = previewContainer.children.length;
            if (currentImgs + files.length > 4) {
                alert("每個瓶罐最多只能上傳 4 張照片！");
                input.value = ''; // Reset
                return;
            }

            // 讀取並顯示預覽
            for (const file of files) {
                const base64 = await getBase64(file);
                const div = document.createElement('div');
                div.className = 'w-32 h-32 rounded-lg overflow-hidden border border-gray-200 relative flex-shrink-0 group';
                div.innerHTML = `
                    <img src="${base64}" class="w-full h-full object-cover">
                    <button onclick="this.parentElement.remove(); updateGlobalButton()" class="absolute top-1 right-1 bg-red-500 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition shadow-sm">
                        <span class="material-icons text-xs block">close</span>
                    </button>
                    <input type="hidden" class="img-data" value="${base64}">
                    <input type="hidden" class="img-type" value="${file.type}">
                    <input type="hidden" class="img-name" value="${file.name}">
                `;
                previewContainer.appendChild(div);
            }
            input.value = ''; // 讓同樣檔案可以再選
            updateGlobalButton();
        }

        function updateGlobalButton() {
            const hasImages = document.querySelectorAll('.img-data').length > 0;
            const btn = document.getElementById('analyzeAllBtn');
            if (hasImages) {
                btn.classList.remove('hidden');
            } else {
                btn.classList.add('hidden');
            }
        }

        // --- 核心分析邏輯 ---

        async function analyzeAll() {
            const cards = document.querySelectorAll('.product-card');
            const btn = document.getElementById('analyzeAllBtn');
            
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            btn.innerHTML = `<span class="loader !w-4 !h-4 !border-t-white mr-2"></span> 分析中...`;

            for (const card of cards) {
                const imgElements = card.querySelectorAll('.img-data');
                if (imgElements.length === 0) continue;

                // UI 狀態：切換到結果區
                const resultSection = card.querySelector('.result-section');
                resultSection.classList.remove('hidden');
                
                const status = card.querySelector('.status-indicator');
                const report = card.querySelector('.report-content');
                const saveBtn = card.querySelector('.btn-save');
                const searchBtn = card.querySelector('.btn-search-product');

                status.innerHTML = `<span class="loader w-4 h-4 border-t-blue-600 border-blue-200"></span> 正在連線 AI 進行分析...`;
                status.className = "status-indicator mb-4 flex items-center gap-2 text-sm font-bold text-blue-600";
                
                // 準備 Payload
                const imagesPayload = [];
                imgElements.forEach(el => {
                    const base64 = el.value.split(',')[1];
                    const type = el.parentElement.querySelector('.img-type').value;
                    const name = el.parentElement.querySelector('.img-name').value;
                    imagesPayload.push({ mimeType: type, data: base64, filename: name });
                });

                try {
                    // 呼叫後端：模式 = analyze
                    const response = await fetch(GAS_WEB_APP_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({
                            mode: "analyze",
                            images: imagesPayload
                        })
                    });
                    
                    const resJson = await response.json();

                    if (resJson.status === 'success') {
                        // 顯示報告
                        report.innerHTML = marked.parse(resJson.data.fullReport);
                        status.innerHTML = `<span class="material-icons text-green-500">check_circle</span> 分析完成 (尚未存檔)`;
                        status.className = "status-indicator mb-4 flex items-center gap-2 text-sm font-bold text-green-600";
                        
                        // 顯示按鈕
                        saveBtn.classList.remove('hidden');
                        
                        // 設定搜尋連結
                        if (resJson.data.productName && resJson.data.productName !== "未知") {
                            searchBtn.href = `https://www.google.com/search?q=${encodeURIComponent(resJson.data.productName)}`;
                            searchBtn.classList.remove('hidden');
                        }

                        // 將完整資料暫存到 hidden input，供存檔使用
                        card.querySelector('.hidden-result-data').value = JSON.stringify(resJson.data);

                    } else {
                        throw new Error(resJson.message);
                    }

                } catch (err) {
                    console.error(err);
                    report.innerHTML = `<span class="text-red-500">分析失敗：${err.message}</span>`;
                    status.innerHTML = `<span class="material-icons text-red-500">error</span> 發生錯誤`;
                }
            }

            btn.disabled = false;
            btn.classList.remove('opacity-50', 'cursor-not-allowed');
            btn.innerHTML = `<span class="material-icons">search</span> <span>開始批量分析</span>`;
        }

        // --- 存檔邏輯 ---

        async function saveResult(btn) {
            const card = btn.closest('.product-card');
            const dataStr = card.querySelector('.hidden-result-data').value;
            if (!dataStr) return;

            const data = JSON.parse(dataStr);
            
            // UI 更新
            btn.disabled = true;
            const originalText = btn.innerHTML;
            btn.innerHTML = `<span class="loader !w-3 !h-3 !border-t-white mr-1"></span> 上傳中...`;
            btn.classList.add('opacity-75');

            try {
                // 呼叫後端：模式 = save
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        mode: "save",
                        data: data
                    })
                });

                const resJson = await response.json();
                
                if (resJson.status === 'success') {
                    btn.innerHTML = `<span class="material-icons text-sm">cloud_done</span> 已上傳`;
                    btn.className = "btn-save bg-gray-100 text-gray-500 text-sm font-bold px-4 py-2 rounded-lg cursor-default flex items-center gap-2 border border-gray-200";
                    
                    const status = card.querySelector('.status-indicator');
                    status.innerHTML += ` <span class="bg-green-100 text-green-700 text-xs px-2 py-0.5 rounded ml-2">已存檔</span>`;
                } else {
                    throw new Error("存檔失敗");
                }

            } catch (err) {
                alert("上傳失敗，請重試：" + err.message);
                btn.disabled = false;
                btn.innerHTML = originalText;
                btn.classList.remove('opacity-75');
            }
        }

        function getBase64(file) {
            return new Promise((r, j) => {
                const reader = new FileReader();
                reader.onload = () => r(reader.result);
                reader.onerror = j;
                reader.readAsDataURL(file);
            });
        }
    </script>
</body>
</html>
